let S = { cur: 'overview', vid: 'v1', vf: 'all', tid: 't1', pf: 'all', bf: 'all', sgid: 'SG-0412', reasons: [], decision: null, reasonText: '', draft: '', proof: {} };

/* ---------- Navigation ---------- */

  ['providers', 'Providers', 'user', null],
  ['facilities', 'Facilities', 'building', null],
  ['bookings', 'Bookings', 'calendar', null],
  ['support', 'Support', 'mail', () => TICKETS.filter(t => t.st === 'open').length],
  ['safeguard', 'Safeguarding', 'alert', () => CASES.filter(c => c.st !== 'Closed').length, true],

  ['roles', 'Staff and roles', 'lock', null],
  ['audit', 'Audit log', 'doc', null],
  ['flags', 'Feature flags', 'settings', null]
];
const TITLES = { overview: ['Overview', 'Today, Wednesday 28 October'], verify: ['Verification', 'Licences and documents waiting for a decision'], providers: ['Providers', 'Everyone who can take bookings'], facilities: ['Facilities', 'Pharmacies, labs and hospitals'], bookings: ['Bookings', 'Live and recent visits'], support: ['Support', 'Patient and provider messages'], safeguard: ['Safeguarding', 'Restricted: visible to safeguarding officers only'], payouts: ['Payouts', 'Weekly payout run and failed transfers'], roles: ['Staff and roles', 'Who can do what on this console'], audit: ['Audit log', 'Every sensitive action, with who and why'], flags: ['Feature flags', 'Switch features on as they launch'] };
function go(name) { S.cur = name; S.decision = null; S.reasons = []; S.reasonText = ''; render(); window.scrollTo(0, 0); }
function renderNav() {
  document.getElementById('nav').innerHTML = NAV.map(([k, l, i, c, hot]) => {

    return `<button class="nav ${S.cur === k ? 'on' : ''}" onclick="go('${k}')">${ic(i)}${l}${n ? `<span class="n ${hot ? 'hot' : ''}">${n}</span>` : ''}</button>`;

/* ---------- Overview ---------- */
function vOverview() {

  <div class="kpis">

    <div class="kpi"><small>Live providers</small><b class="num">128</b><div class="sub">14 new this month</div></div>
    <div class="kpi warn"><small>Waiting for verification</small><b class="num">${VER.filter(v => v.status !== 'approved').length}</b><div class="sub dn">2 waiting over 3 days</div></div>
    <div class="kpi warn"><small>Open tickets</small><b class="num">${TICKETS.filter(t => t.st === 'open').length}</b><div class="sub dn">1 due within 2 hours</div></div>

    <div class="card">
      <div class="card-h"><h3>Bookings, last 14 days</h3><span class="small muted" style="font-size:12px;color:var(--muted);font-weight:600">Completed and in progress</span></div>
      <div class="card-b">

        <div class="att"><div class="ico" style="background:#E6F6EE;color:var(--success)">${ic('shield')}</div><div class="main"><b>3 providers ready for a decision</b><small>Verification queue</small></div><button class="btn btn-s btn-sm" onclick="go('verify')">Open</button></div>

    </div>
  </div>
  <div class="grid2" style="margin-top:16px">

/* ---------- Verification queue ---------- */
const STATUS_PILL = { review: ['info', 'clock', 'Under review'], new: ['idle', 'clock', 'New'], info: ['warn', 'alert', 'Needs info'], expired: ['bad', 'x', 'Licence expired'], approved: ['ok', 'check', 'Approved'], rejected: ['bad', 'x', 'Rejected'] };
function vVerify() {
  const list = VER.filter(v => S.vf === 'all' || (S.vf === 'overdue' ? v.days >= 3 : S.vf === 'facility' ? v.kind === 'facility' : v.kind === 'person'));
  const sel = VER.find(v => v.id === S.vid) || VER[0];
  const counts = { all: VER.length, overdue: VER.filter(v => v.days >= 3).length, person: VER.filter(v => v.kind === 'person').length, facility: VER.filter(v => v.kind === 'facility').length };
  const [sk, si, sl] = STATUS_PILL[sel.status];
  const decisions = [['approve', 'Approve', 'btn-ok'], ['info', 'Needs info', 'btn-s'], ['reject', 'Reject', 'btn-d']];
  return `
  <div class="page-head"><div><h2>Verification queue</h2><p>Check the licence against the regulator register, then decide. Every decision is logged with a reason.</p></div>
    <div class="tabs-s">${[['all', 'All'], ['overdue', 'Over 3 days'], ['person', 'Individuals'], ['facility', 'Facilities']].map(([k, l]) => `<button class="${S.vf === k ? 'on' : ''}" onclick="S.vf='${k}';render()">${l}<span class="c">${counts[k]}</span></button>`).join('')}</div>
  </div>
  <div class="split">
    <div class="card">
      <table><thead><tr><th>Applicant</th><th>Type</th><th>Waiting</th><th>Status</th></tr></thead><tbody>
        ${list.map(v => { const [k, i, l] = STATUS_PILL[v.status]; return `<tr class="click ${v.id === sel.id ? 'sel' : ''}" onclick="S.vid='${v.id}';S.decision=null;S.reasons=[];S.reasonText='';render()"><td><div class="who"><b>${v.name}</b><small>${v.city} · ${v.regNo}</small></div></td><td>${v.type}</td><td class="num ${v.days >= 3 ? 'sev-m' : ''}">${v.days} ${v.days === 1 ? 'day' : 'days'}</td><td>${pill(k, i, l)}</td></tr>`; }).join('')}
      </tbody></table>
    </div>
    <div class="card">
      <div class="card-b">
        <div class="detail-head"><div class="av">${initials(sel.name)}</div><div style="flex:1"><h3>${sel.name}</h3><div class="small muted">${sel.type} · ${sel.spec}</div><div style="margin-top:6px">${pill(sk, si, sl)}</div></div></div>
        <div class="kv2"><div><small>${sel.reg} number</small><b class="num">${sel.regNo}</b></div><div><small>Applied</small><b>${sel.applied}</b></div><div><small>Location</small><b>${sel.city}</b></div><div><small>Waiting</small><b>${sel.days} ${sel.days === 1 ? 'day' : 'days'}</b></div></div>

        <h3 style="font-size:14px;margin:20px 0 10px">Documents</h3>
        ${sel.docs.map(([t, s, c]) => `<div class="doc-row ${c === 'flag' ? 'flag' : ''}"><div class="ico">${ic('doc')}</div><div class="main"><b>${t}</b><small>${s}</small></div>${c === 'ok' ? pill('ok', 'check', 'OK') : c === 'flag' ? pill('warn', 'alert', 'Check') : pill('idle', 'clock', 'Pending')}</div>`).join('')}

        <div class="notice-b" style="margin-top:12px">${ic('shield')}<span>Register check: open the ${sel.reg} register and confirm the name, number and status match before you approve.</span></div>

        ${sel.status === 'approved' || sel.status === 'rejected' ? `<p class="note-small">This application is closed.</p>` : `
        <div style="margin-top:18px">
          <div class="tabs-s" style="margin-bottom:12px">${decisions.map(([k, l]) => `<button class="${S.decision === k ? 'on' : ''}" onclick="S.decision='${k}';render()">${l}</button>`).join('')}</div>
          ${S.decision === 'approve' ? `<p class="small" style="margin-bottom:10px">Approving makes the profile visible to patients and lets the provider take bookings.</p>` : ''}
          ${S.decision === 'info' || S.decision === 'reject' ? `
            <div class="reason-chips">${['Name mismatch', 'Blurry scan', 'Licence not on register', 'Expired licence', 'Missing document'].map(r => `<button class="${S.reasons.includes(r) ? 'on' : ''}" onclick="toggleReason('${r}')">${r}</button>`).join('')}</div>
            <textarea class="txt" placeholder="Write a clear reason the applicant can act on." oninput="S.reasonText=this.value;document.getElementById('dbtn').disabled=!canDecide()">${S.reasonText}</textarea>
            <p class="note-small">${S.decision === 'reject' ? 'Rejections are emailed with this reason.' : 'The applicant gets the reason and a link to upload the fix.'}</p>` : ''}
          <div class="decide">${decisions.map(([k, l, c]) => `<button ${k === S.decision ? '' : ''} class="btn ${c}" ${S.decision === k ? '' : 'style="opacity:0.55"'} onclick="S.decision='${k}';render()">${l}</button>`).join('')}</div>
          <div style="margin-top:12px;display:flex;justify-content:flex-end"><button id="dbtn" class="btn btn-p" ${canDecide() ? '' : 'disabled'} onclick="confirmDecision()">${S.decision ? 'Confirm and log' : 'Choose a decision'}</button></div>
        </div>`}
      </div>
      <div class="card-b" style="border-top:1px solid var(--line)"><h3 style="font-size:14px;margin-bottom:12px">History for this application</h3>
        <div class="timeline">
          <div class="tl done"><span class="d"></span><div><b>Application received</b><small>${sel.applied} · ${sel.name}</small></div></div>
          <div class="tl ${sel.status === 'new' ? 'now' : 'done'}"><span class="d"></span><div><b>Documents uploaded</b><small>Automatic check complete</small></div></div>
          <div class="tl ${sel.status === 'new' ? 'todo' : 'now'}"><span class="d"></span><div><b>Manual review</b><small>${sel.status === 'new' ? 'Waiting for a reviewer' : 'Assigned to Tolu A.'}</small></div></div>
        </div>
      </div>
    </div>
  </div>`;
}
function toggleReason(r) { S.reasons = S.reasons.includes(r) ? S.reasons.filter(x => x !== r) : [...S.reasons, r]; render(); }
function canDecide() {
  if (!S.decision) return false;
  if (S.decision === 'approve') return true;
  return S.reasons.length > 0 || S.reasonText.trim().length > 5;
}
function confirmDecision() {
  if (!canDecide()) return;
  const v = VER.find(x => x.id === S.vid);
  const map = { approve: ['approved', 'Approved. The profile is now live.'], info: ['info', 'Sent back for more information.'], reject: ['rejected', 'Rejected and emailed with the reason.'] };
  v.status = map[S.decision][0];
  const msg = map[S.decision][1];
  S.decision = null; S.reasons = []; S.reasonText = '';
  toast(msg);
  render();
}

/* ---------- Providers and facilities ---------- */
function vProviders(facilities = false) {
  const list = PROVIDERS.filter(p => (S.pf === 'all' || p.status === S.pf));
  const counts = { all: PROVIDERS.length, live: PROVIDERS.filter(p => p.status === 'live').length, paused: PROVIDERS.filter(p => p.status === 'paused').length, suspended: PROVIDERS.filter(p => p.status === 'suspended').length };
  const stPill = { live: ['ok', 'check', 'Live'], paused: ['idle', 'clock', 'Paused'], suspended: ['bad', 'x', 'Suspended'] };
  if (facilities) return `
    <div class="page-head"><div><h2>Facilities</h2><p>Pharmacies, labs and hospitals. Facility stock, tests and capacity are managed by each facility.</p></div><button class="btn btn-p" onclick="toast('Invite a facility opens here')">${ic('plus')} Invite facility</button></div>
    <div class="card"><table><thead><tr><th>Facility</th><th>Type</th><th>Regulator</th><th>Status</th><th>Health</th><th></th></tr></thead><tbody>
      ${[['Lagoon Pharmacy Ikeja', 'Pharmacy', 'PCN', 'live', 'Stock updated today'], ['Mainstay Diagnostics', 'Diagnostic lab', 'MLSCN', 'live', 'Price list complete'], ['Oyo Central Medical Centre', 'Hospital', 'Oyo State Ministry of Health', 'live', '2 referrals waiting']].map(([n, t, r, s, h]) => `<tr><td><div class="who"><b>${n}</b><small>Ibadan or Ikeja</small></div></td><td>${t}</td><td>${r}</td><td>${pill(...stPill[s].slice(0, 2), stPill[s][2])}</td><td class="small">${h}</td><td style="text-align:right"><button class="btn btn-s btn-sm" onclick="toast('Facility profile opens here')">Open</button></td></tr>`).join('')}
    </tbody></table></div>`;
  return `
    <div class="page-head"><div><h2>Providers</h2><p>Everyone who can take bookings. Suspending a provider hides them from patients at once and pauses their open bookings.</p></div>
      <div class="tabs-s">${[['all', 'All'], ['live', 'Live'], ['paused', 'Paused'], ['suspended', 'Suspended']].map(([k, l]) => `<button class="${S.pf === k ? 'on' : ''}" onclick="S.pf='${k}';render()">${l}<span class="c">${counts[k]}</span></button>`).join('')}</div></div>
    <div class="card"><table><thead><tr><th>Provider</th><th>Type</th><th>Area</th><th>Rating</th><th>Bookings</th><th>Open flags</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(p => `<tr><td><div class="who"><b>${p.name}</b><small>${p.id.toUpperCase()}</small></div></td><td>${p.type}</td><td>${p.city}</td><td class="num">${p.rating.toFixed(1)}</td><td class="num">${p.bookings}</td><td>${p.flags ? pill('warn', 'alert', p.flags + ' open') : '<span class="small muted">None</span>'}</td><td>${pill(...stPill[p.status].slice(0, 2), stPill[p.status][2])}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-s btn-sm" onclick="toast('Opens the full provider record')">View</button> ${p.status === 'suspended' ? `<button class="btn btn-s btn-sm" onclick="setProv('${p.id}','live')">Reinstate</button>` : `<button class="btn btn-d btn-sm" onclick="openSuspend('${p.id}')">Suspend</button>`}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function setProv(id, st) { PROVIDERS.find(p => p.id === id).status = st; toast('Provider reinstated and logged'); render(); }
function openSuspend(id) {
  const p = PROVIDERS.find(x => x.id === id);
  openModal('Suspend ' + p.name + '?', `<p>They will disappear from search at once. Open bookings are offered to the next nearest provider. This is logged with your reason.</p>
    <div class="reason-chips">${['Patient complaint', 'Licence concern', 'Missing visit records', 'Safeguarding'].map(r => `<button onclick="this.classList.toggle('on')">${r}</button>`).join('')}</div>
    <textarea class="txt" placeholder="Reason, in plain words" style="min-height:70px"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-d" onclick="closeModal();PROVIDERS.find(x=>x.id==='${id}').status='suspended';toast('Provider suspended and logged');render()">Suspend provider</button></div>`);
}

/* ---------- Bookings ---------- */
const BK_PILL = { requested: ['info', 'clock', 'Requested'], 'on the way': ['warn', 'pin', 'On the way'], completed: ['ok', 'check', 'Completed'], cancelled: ['idle', 'x', 'Cancelled'], disputed: ['bad', 'alert', 'Disputed'] };
function vBookings() {
  const list = BOOKINGS.filter(b => S.bf === 'all' || b.st === S.bf);
  return `
  <div class="page-head"><div><h2>Bookings</h2><p>Patient first names only by default. Opening full details asks for an access reason, and that is logged.</p></div>
    <div class="tabs-s">${[['all', 'All'], ['requested', 'Requested'], ['on the way', 'On the way'], ['disputed', 'Disputed']].map(([k, l]) => `<button class="${S.bf === k ? 'on' : ''}" onclick="S.bf='${k}';render()">${l}</button>`).join('')}</div></div>
  <div class="card"><table><thead><tr><th>Reference</th><th>Patient</th><th>Provider</th><th>Service</th><th>When</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(b => { const [k, i, l] = BK_PILL[b.st]; return `<tr><td class="num"><b style="color:var(--navy)">${b.id}</b></td><td>${b.who}</td><td>${b.prov}</td><td>${b.svc}</td><td class="small">${b.when}</td><td class="num">${ngn(b.amt)}</td><td>${pill(k, i, l)}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-s btn-sm" onclick="openAccess('${b.id}')">View</button>${b.st === 'disputed' ? ` <button class="btn btn-p btn-sm" onclick="toast('Refund issued and logged')">Refund</button>` : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function openAccess(id) {
  openModal('View booking ' + id, `<div class="notice-a">${ic('eye')}<span>Full patient details are shown only with a reason. This is logged against your name.</span></div>
    <p style="margin:14px 0 8px;font-size:13px;font-weight:700">Reason for access</p>
    <div class="reason-chips">${['Support ticket', 'Payment query', 'Safeguarding', 'Verification check'].map(r => `<button onclick="this.classList.toggle('on')">${r}</button>`).join('')}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="closeModal();toast('Access logged. Details open.')">Open record</button></div>`);
}

/* ---------- Support ---------- */
function vSupport() {
  const t = TICKETS.find(x => x.id === S.tid) || TICKETS[0];
  const pri = { high: ['bad', 'alert', 'High'], med: ['warn', 'clock', 'Medium'], low: ['idle', 'clock', 'Low'] }[t.pri];
  return `
  <div class="page-head"><div><h2>Support</h2><p>Reply in plain language. Use a macro to start, then edit it for the person.</p></div></div>
  <div class="split">
    <div class="card"><table><thead><tr><th>Ticket</th><th>From</th><th>SLA</th></tr></thead><tbody>
      ${TICKETS.map(x => `<tr class="click ${x.id === t.id ? 'sel' : ''}" onclick="S.tid='${x.id}';render()"><td><div class="who"><b>${x.subj}</b><small>${x.who}</small></div></td><td>${x.from}</td><td class="small ${x.pri === 'high' ? 'sev-h' : ''}">${x.sla}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="card"><div class="card-h"><div><h3>${t.subj}</h3><div class="small muted" style="font-size:12px">${t.from} · ${t.who}</div></div>${pill(pri[0], pri[1], pri[2] + ' priority')}</div>
      <div class="card-b">
        <div class="thread">${t.msgs.map(([d, m]) => `<div class="msg ${d}"><small>${d === 'in' ? t.who : 'StreetdocMD support'}</small>${m}</div>`).join('')}</div>
        <div style="margin:14px 0 8px">${['Thanks for your patience', 'We are checking this now', 'Refund request raised', 'Here is how to add a family member'].map(m => `<button class="macro" onclick="S.draft=this.textContent;document.getElementById('reply').value=this.textContent">${m}</button>`).join('')}</div>
        <textarea id="reply" class="txt" placeholder="Write your reply">${S.draft}</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="small muted" style="font-size:12px">Replies are sent by email and in the app.</span><div class="row" style="display:flex;gap:8px"><button class="btn btn-s" onclick="setTicket('${t.id}','waiting')">Mark waiting</button><button class="btn btn-p" onclick="sendReply('${t.id}')">Send reply</button></div></div>
      </div>
    </div>
  </div>`;
}
function sendReply(id) {
  const t = TICKETS.find(x => x.id === id);
  const v = document.getElementById('reply').value.trim();
  if (!v) return;
  t.msgs.push(['out', v]); t.st = 'waiting'; S.draft = '';
  toast('Reply sent'); render();
}
function setTicket(id, st) { TICKETS.find(x => x.id === id).st = st; toast('Ticket updated'); render(); }

/* ---------- Safeguarding ---------- */
function vSafeguard() {
  const c = CASES.find(x => x.id === S.sgid) || CASES[0];
  return `
  <div class="page-head"><div><h2>Safeguarding</h2><p><span class="secret">${ic('lock')} Restricted</span> Visible only to safeguarding officers. Never shown to providers or patients, and never included in standard exports.</p></div></div>
  <div class="split">
    <div class="card"><table><thead><tr><th>Case</th><th>Type</th><th>Severity</th><th>Status</th></tr></thead><tbody>
      ${CASES.map(x => `<tr class="click ${x.id === c.id ? 'sel' : ''}" onclick="S.sgid='${x.id}';render()"><td><b style="color:var(--navy)">${x.id}</b></td><td>${x.type}</td><td class="${x.sev === 'high' ? 'sev-h' : 'sev-m'}">${x.sev === 'high' ? 'High' : 'Medium'}</td><td>${x.st}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="card case-warn"><div class="card-h"><div><h3>${c.id} · ${c.type}</h3><div class="small muted" style="font-size:12px">Opened ${c.opened} · Owner: ${c.owner}</div></div><span class="secret">${ic('lock')} Restricted</span></div>
      <div class="card-b">
        <p class="small" style="line-height:1.6">${c.note}</p>
        <div class="notice-a" style="margin-top:14px">${ic('alert')}<span>Do not contact the patient or provider directly from this screen. Follow the safeguarding procedure and record each step.</span></div>
        <h3 style="font-size:14px;margin:18px 0 10px">Procedure</h3>
        <div class="timeline">
          <div class="tl done"><span class="d"></span><div><b>Concern received</b><small>Logged with the visit reference</small></div></div>
          <div class="tl ${c.owner === 'Unassigned' ? 'now' : 'done'}"><span class="d"></span><div><b>Assign an officer</b><small>${c.owner === 'Unassigned' ? 'Not yet assigned' : c.owner}</small></div></div>
          <div class="tl todo"><span class="d"></span><div><b>Review the record and decide on action</b><small>Pause bookings, request notes, or escalate</small></div></div>
          <div class="tl todo"><span class="d"></span><div><b>Record the outcome and close</b><small>Outcome sent to the people involved, as the policy requires</small></div></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
          <button class="btn btn-p" onclick="CASES.find(x=>x.id==='${c.id}').owner='Tolu A. (you)';toast('Assigned to you and logged');render()">Assign to me</button>
          <button class="btn btn-d" onclick="toast('Bookings paused for this provider and logged')">Pause provider bookings</button>
          <button class="btn btn-s" onclick="toast('Escalated to the safeguarding lead')">Escalate</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- Payouts ---------- */
function vPayouts() {
  const sel = PAYOUTS.filter(p => p.sel && p.st === 'queued');
  const total = sel.reduce((a, p) => a + p.amt, 0);
  const cls = { queued: ['info', 'clock', 'Queued'], failed: ['bad', 'x', 'Failed'], paid: ['ok', 'check', 'Paid'] };
  return `
  <div class="page-head"><div><h2>Payouts</h2><p>Review the weekly run, then approve it. Failed transfers need a fix before they can be retried.</p></div>
    <button class="btn btn-p" ${sel.length ? '' : 'disabled'} onclick="openModal('Approve payout run', '<p>You are approving <b>${sel.length} transfers</b> totalling <b>${ngn(total)}</b>. Each one is logged to your name.</p><div style=&quot;display:flex;gap:10px;justify-content:flex-end&quot;><button class=&quot;btn btn-s&quot; onclick=&quot;closeModal()&quot;>Cancel</button><button class=&quot;btn btn-p&quot; onclick=&quot;approveRun()&quot;>Approve and send</button></div>')">${ic('check')} Approve run · ${ngn(total)}</button></div>
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><small>In this run</small><b class="num">${ngn(total)}</b><div class="sub">${sel.length} transfers selected</div></div>
    <div class="kpi warn"><small>Failed transfers</small><b class="num">${PAYOUTS.filter(p => p.st === 'failed').length}</b><div class="sub dn">Bank details need checking</div></div>
    <div class="kpi"><small>Next payout day</small><b>Friday 30 Oct</b><div class="sub">Automatic run at 10 am</div></div>
  </div>
  <div class="card"><table><thead><tr><th style="width:40px"></th><th>Reference</th><th>Payee</th><th>Bank</th><th>Amount</th><th>Status</th></tr></thead><tbody>
    ${PAYOUTS.map(p => `<tr><td>${p.st === 'queued' ? `<input type="checkbox" class="check" ${p.sel ? 'checked' : ''} onchange="PAYOUTS.find(x=>x.id==='${p.id}').sel=this.checked;render()">` : ''}</td><td class="num"><b style="color:var(--navy)">${p.id}</b></td><td>${p.who}</td><td class="small">${p.bank}</td><td class="num">${ngn(p.amt)}</td><td>${pill(...cls[p.st].slice(0, 2), cls[p.st][2])}${p.st === 'failed' ? ` <button class="btn btn-s btn-sm" onclick="toast('Bank details checked. Retry queued.');PAYOUTS.find(x=>x.id==='${p.id}').st='queued';render()">Retry</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="note-small">Reconciliation: payments received ${ngn(1480000)} · payouts ${ngn(1212000)} · service charge ${ngn(74000)} · difference ₦0.</p>`;
}
function approveRun() { PAYOUTS.forEach(p => { if (p.sel && p.st === 'queued') p.st = 'paid'; }); closeModal(); toast('Payout run approved and sent'); render(); }

/* ---------- Staff and roles ---------- */
function vRoles() {
  return `
  <div class="page-head"><div><h2>Staff and roles</h2><p>Give each person the least access they need. Changes take effect straight away and are logged.</p></div><button class="btn btn-p" onclick="toast('Invite staff form opens here')">${ic('plus')} Invite staff</button></div>
  <div class="card"><table class="perm"><thead><tr><th>Permission</th>${ROLES.map(r => `<th style="text-align:center">${r}</th>`).join('')}</tr></thead><tbody>
    ${PERMS.map(([p, arr], i) => `<tr><td style="font-weight:600;color:var(--navy)">${p}</td>${arr.map((v, j) => `<td><input type="checkbox" class="check" ${v ? 'checked' : ''} ${j === 0 ? 'disabled' : ''} onchange="PERMS[${i}][1][${j}]=this.checked?1:0;toast('Permission changed and logged')"></td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <p class="note-small">Super admin always keeps full access so the console cannot be locked out.</p>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>People with access</h3></div><table><thead><tr><th>Name</th><th>Role</th><th>Last sign in</th><th>Status</th></tr></thead><tbody>
    ${[['Tolu Adebayo', 'Verification lead', 'Today, 8:02 am', 'ok', 'Active'], ['Ife Okafor', 'Support agent', 'Today, 7:50 am', 'ok', 'Active'], ['Samuel Idowu', 'Finance', 'Yesterday', 'ok', 'Active'], ['Grace Lawal', 'Safeguarding', '2 days ago', 'ok', 'Active'], ['Former staff', 'Support agent', '3 months ago', 'idle', 'Removed']].map(([n, r, s, c, t]) => `<tr><td><div class="who"><b>${n}</b></div></td><td>${r}</td><td class="small">${s}</td><td>${pill(c, c === 'ok' ? 'check' : 'x', t)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- Audit ---------- */
function vAudit() {
  return `
  <div class="page-head"><div><h2>Audit log</h2><p>Every sensitive action, who did it and why. This log cannot be edited.</p></div><button class="btn btn-s" onclick="toast('Export started. Patient details are excluded.')">${ic('doc')} Export</button></div>
  <div class="card"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Object</th><th>Reason</th></tr></thead><tbody>
    ${AUDIT.map(([w, p, a, o, r]) => `<tr><td class="num small" style="white-space:nowrap;color:var(--muted)">${w}</td><td>${p}</td><td><b style="color:var(--navy)">${a}</b></td><td>${o}</td><td class="small">${r}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- Feature flags ---------- */
function vFlags() {
  return `
  <div class="page-head"><div><h2>Feature flags</h2><p>Turn features on as they are ready. Patients and providers see a feature only when it is on.</p></div></div>
  <div class="card">${FLAGS.map((f, i) => `<div style="display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)">
      <div style="flex:1"><b style="font-size:15px;color:var(--navy)">${f.n}</b><div class="small muted" style="margin-top:3px">${f.d}</div></div>
      ${f.on ? pill('ok', 'check', 'On') : pill('idle', 'clock', 'Off')}
      <button class="toggle ${f.on ? 'on' : ''}" aria-label="${f.n}" onclick="FLAGS[${i}].on=!FLAGS[${i}].on;toast('${f.n} ' + (FLAGS[${i}].on ? 'on' : 'off') + ' and logged');render()"></button>
    </div>`).join('')}</div>
  <p class="note-small">Only Super admin can change flags. Each change is logged with the time and reason.</p>`;
}

/* ---------- Route table and render ---------- */
const VIEWS = { overview: vOverview, verify: vVerify, providers: () => vProviders(false), facilities: () => vProviders(true), bookings: vBookings, support: vSupport, safeguard: vSafeguard, payouts: vPayouts, roles: vRoles, audit: vAudit, flags: vFlags };
function render() {
  renderNav();
  const [t, sub] = TITLES[S.cur] || [S.cur, ''];
  document.getElementById('title').textContent = t;
  document.getElementById('crumb').textContent = sub;
  const keep = window.scrollY;
  document.getElementById('content').innerHTML = (VIEWS[S.cur] || (() => '<p>Not found</p>'))();
  window.scrollTo(0, keep);
}
render();
</script>
</body>
</html>
