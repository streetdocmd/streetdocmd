<script>
/* ---------- Helpers ---------- */
const ic = (n, c = '', st = '') => `<svg class="i ${c}" style="${st}"><use href="#i-${n}"/></svg>`;
const ngn = n => '₦' + n.toLocaleString('en-NG');
const ver = r => `<span class="verified-line">${ic('shield')} ${r} verified</span>`;
const star = r => `<span class="rating">${ic('star', 'star')} ${r.toFixed(1)}</span>`;
const avatar = (ini, tint, cls = '') => `<div class="av ${cls}" style="background:${tint}">${ini}</div>`;

const ROLES = {
  doctor:   { label: 'Doctor', short: 'Doctor', reg: 'MDCN', kind: 'person', fee: 12000, tint: '#CFE3FF', ini: 'AO', name: 'Dr. Adaeze Okonkwo', first: 'Adaeze', spec: 'General practice · Ikeja', icon: 'steth', desc: 'Home consultations, prescriptions and referrals.' },
  nurse:    { label: 'Nurse', short: 'Nurse', reg: 'NMCN', kind: 'person', fee: 8500, tint: '#E5DDFB', ini: 'TB', name: 'Tunde Bello, RN', first: 'Tunde', spec: 'Wound care · Ikeja', icon: 'heart', desc: 'Dressings, post surgical checks and care at home.' },
  physio:   { label: 'Physiotherapist', short: 'Physio', reg: 'MRTB', kind: 'person', fee: 10000, tint: '#FFE6C9', ini: 'KO', name: 'Kemi Ojo, PT', first: 'Kemi', spec: 'Physiotherapy · Ibadan North', icon: 'pulse', desc: 'Assessments, exercise plans and follow up sessions.' },
  pharmacy: { label: 'Pharmacy', short: 'Pharmacy', reg: 'PCN', kind: 'facility', tint: '#FFF1C9', ini: 'LP', name: 'Lagoon Pharmacy Ikeja', first: 'Lagoon', spec: 'Pharmacy · Ikeja', icon: 'pill', desc: 'Stock, medicine orders and delivery.' },
  lab:      { label: 'Diagnostic lab', short: 'Lab', reg: 'MLSCN', kind: 'facility', tint: '#D8F5EE', ini: 'MD', name: 'Mainstay Diagnostics', first: 'Mainstay', spec: 'Diagnostic lab · Bodija', icon: 'flask', desc: 'Sample collection, test processing and results.' },
  hospital: { label: 'Hospital', short: 'Hospital', reg: 'Oyo State Ministry of Health', kind: 'facility', tint: '#FFE1E6', ini: 'OC', name: 'Oyo Central Medical Centre', first: 'Oyo Central', spec: 'Hospital · Ring Road', icon: 'building', desc: 'Capacity, referrals and specialist clinics.' }
};
const ROLE_ORDER = ['doctor', 'nurse', 'physio', 'pharmacy', 'lab', 'hospital'];
const isFac = () => ROLES[S.role].kind === 'facility';

/* Sample data: person */
const REQS = [
  { id: 'r1', who: 'Mrs Ngozi', age: 68, what: 'General consultation', area: 'Ikeja GRA', dist: '3.4 km', pay: 10800, reason: 'Blood pressure check and medicine review.', allergy: 'None recorded', now: true },
  { id: 'r2', who: 'Chidi E.', age: 34, what: 'Wellness and lab sample', area: 'Ikeja', dist: '5.1 km', pay: 6500, reason: 'Routine full blood count.', allergy: 'Penicillin', now: false, when: 'Today, 4:30 pm' },
  { id: 'r3', who: 'Amina S.', age: 52, what: 'Wound dressing', area: 'Maryland', dist: '6.8 km', pay: 7000, reason: 'Dressing change after surgery.', allergy: 'Latex', now: false, when: 'Tomorrow, 9:00 am' }
];
const SCHED = [
  { t: '9:00 am', who: 'Ahmed Bello', what: 'Wound dressing', st: 'done' },
  { t: '11:30 am', who: 'Mrs Ngozi', what: 'General consultation', st: 'next' },
  { t: '2:00 pm', who: 'Amina Sule', what: 'Post surgical check', st: 'todo' },
  { t: '4:30 pm', who: 'Chidi E.', what: 'Lab sample collection', st: 'todo' }
];
const COUNTS = { 27: 3, 28: 4, 29: 2, 30: 0, 31: 5 };
const BLOCK_DEFAULT = { 30: true };

/* Sample data: facility */
const STOCK = [
  { n: 'Amoxicillin 500mg', q: 42, low: 20 }, { n: 'Metformin 500mg', q: 3, low: 10 },
  { n: 'Salbutamol inhaler 100mcg', q: 0, low: 5 }, { n: 'Paracetamol 500mg', q: 120, low: 40 },
  { n: 'Oral rehydration salts', q: 18, low: 15 }
];
const ORDERS = [
  { id: 'o1', who: 'Mrs Ngozi O.', items: 'Amoxicillin, Paracetamol', total: 3000, st: 'new' },
  { id: 'o2', who: 'Tayo A.', items: 'Metformin 500mg (30)', total: 1800, st: 'packing' },
  { id: 'o3', who: 'Bola K.', items: 'Oral rehydration salts (4)', total: 2000, st: 'ready' }
];
const TESTS_Q = [
  { id: 't1', who: 'Ahmed B.', test: 'Full blood count', st: 'collect', note: 'Collect by 11:00 am' },
  { id: 't2', who: 'Ngozi O.', test: 'Malaria parasite test', st: 'processing', note: 'Ready in about 1 hour' },
  { id: 't3', who: 'Chidi E.', test: 'Lipid profile', st: 'ready', note: 'Result ready to upload' }
];
const WARDS = [{ n: 'General ward', free: 12, total: 40 }, { n: 'Maternity', free: 3, total: 15 }, { n: 'Intensive care', free: 0, total: 8 }];
const REFERRALS = [{ id: 'rf1', who: 'Adebayo, 58', from: 'Dr. Adaeze Okonkwo', why: 'Specialist review for chest pain', st: 'new' }, { id: 'rf2', who: 'Funke, 31', from: 'Dr. Emeka Bankole', why: 'Paediatric admission review', st: 'accepted' }];

/* Lab price list: the lab sets these, patients see the active ones */
let LAB_TESTS = [
  { id: 'lt1', n: 'Full blood count', cat: 'Blood', p: 6500, tat: 'Same day', sample: 'Blood', home: true, prep: 'No preparation needed', on: true, upd: '12 Oct' },
  { id: 'lt2', n: 'Malaria parasite test', cat: 'Blood', p: 2500, tat: 'Within 2 hours', sample: 'Blood', home: true, prep: 'No preparation needed', on: true, upd: '12 Oct' },
  { id: 'lt3', n: 'Lipid profile', cat: 'Blood', p: 12000, tat: 'Within 24 hours', sample: 'Blood', home: true, prep: 'Fast for 10 to 12 hours before the sample', on: true, upd: '9 Oct' },
  { id: 'lt4', n: 'HbA1c (diabetes check)', cat: 'Blood', p: 9000, tat: 'Within 24 hours', sample: 'Blood', home: true, prep: 'No preparation needed', on: true, upd: '9 Oct' },
  { id: 'lt5', n: 'Liver function test', cat: 'Blood', p: 11000, tat: 'Within 48 hours', sample: 'Blood', home: false, prep: 'Fast for 8 hours before the sample', on: true, upd: '2 Oct' },
  { id: 'lt6', n: 'Urinalysis', cat: 'Urine', p: 3000, tat: 'Same day', sample: 'Urine', home: true, prep: 'Mid stream sample in a clean container', on: true, upd: '2 Oct' },
  { id: 'lt7', n: 'Stool culture', cat: 'Microbiology', p: 8500, tat: 'Within 48 hours', sample: 'Stool', home: false, prep: 'Collect in the sterile pot provided', on: false, upd: '20 Sep' }
];
const TAT_OPTIONS = ['Same day', 'Within 2 hours', 'Within 24 hours', 'Within 48 hours', 'Within 1 week'];
const CATS = ['Blood', 'Urine', 'Microbiology', 'Hormones', 'Imaging', 'Other'];
const SAMPLES = ['Blood', 'Urine', 'Stool', 'Swab', 'Other'];
const TIMES_L = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const EARN = [18200, 24600, 21000, 33400, 28800, 40100, 20300];

/* ---------- State ---------- */
let S = { role: 'doctor', cur: 'splash', p: {}, stack: [], step: 0, online: true, reqTab: 'new', queueTab: 'all', active: null, rate: 0, day: 28, blocked: { ...BLOCK_DEFAULT }, legal: { a: false, b: false }, sheet: null, splashT: null, last: '', decided: {} };

/* ---------- Navigation ---------- */
function go(name, p = {}) { S.stack.push({ cur: S.cur, p: S.p }); S.cur = name; S.p = p; S.sheet = null; render(); }
function back() { const pr = S.stack.pop(); if (pr) { S.cur = pr.cur; S.p = pr.p; } else { S.cur = 'today'; S.p = {}; } S.sheet = null; render(); }
function swap(name, p = {}) { S.cur = name; S.p = p; S.stack = []; S.sheet = null; render(); }
function toast(msg) { const t = document.getElementById('toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 1900); }
function setRole(r) { S.role = r; S.stack = []; S.cur = 'today'; S.p = {}; S.sheet = null; S.online = true; S.reqTab = 'new'; S.queueTab = 'all'; render(); }
function openSheet(t, b) { S.sheet = { t, b }; render(); }
function closeSheet() { S.sheet = null; render(); }
function openLegal(k) {
  const a = { t: 'Provider Agreement', b: '<p>The full Provider Agreement will appear here once approved by our legal team. It covers how you accept bookings, fees, payouts and your professional responsibilities.</p>' };
  const b = { t: 'Privacy Policy', b: '<p>The full Privacy Policy will appear here. It explains how patient information is shared with you after you accept a booking, and how it is protected.</p>' };
  openSheet(k === 'a' ? a.t : b.t, k === 'a' ? a.b : b.b);
}

/* ---------- Tabs and shell ---------- */
function tabsFor() {
  if (!isFac()) return [['today', 'Today', 'home'], ['requests', 'Requests', 'bell'], ['calendar', 'Calendar', 'calendar'], ['wallet', 'Wallet', 'wallet'], ['profile', 'Profile', 'user']];
  const q = { pharmacy: ['Stock', 'pill'], lab: ['Tests', 'flask'], hospital: ['Capacity', 'building'] }[S.role];
  const r = S.role === 'hospital' ? 'Referrals' : 'Orders';
  return [['today', 'Today', 'home'], ['queue', q[0], q[1]], ['requests', r, S.role === 'hospital' ? 'doc' : 'truck'], ['wallet', 'Wallet', 'wallet'], ['profile', 'Profile', 'user']];
}
const TAB_KEYS = ['today', 'queue', 'requests', 'calendar', 'wallet', 'profile'];
function tabbarHTML() {
  return `<nav class="tabbar">${tabsFor().map(([k, l, i]) => `<button class="tab ${S.cur === k ? 'on' : ''}" style="${S.cur === k ? 'color:var(--teal-deep)' : ''}" onclick="swap('${k}')">${ic(i)}${l}</button>`).join('')}</nav>`;
}
function splashHTML() {
  return `<div class="splash"><div class="cable-wrap"></div><div class="logo-big"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div class="wm">Street<span>DocMD</span></div><div class="tagline">Provider. Care that comes to you.</div><div class="loader"><span></span></div></div>`;
}
function V(html, bar = '') { return { html, bar }; }
function topbar(title, right = '') { return `<div class="topbar"><button class="iconbtn" onclick="back()" aria-label="Back">${ic('chevL')}</button><h2>${title}</h2>${right || '<span style="width:42px"></span>'}</div>`; }

function render() {
  const app = document.getElementById('app');
  const old = document.getElementById('view');
  const keep = old && S.last === S.cur ? old.scrollTop : 0;
  S.last = S.cur;
  if (S.cur === 'splash') {
    app.innerHTML = splashHTML() + '<div class="toast" id="toast"></div>';
    if (!S.splashT) S.splashT = setTimeout(() => { S.splashT = null; if (S.cur === 'splash') swap('roles'); }, 2600);
  } else {
    const fn = VIEWS[S.cur] || (() => V('<div class="empty-line">Screen not found</div>'));
    const v = fn();
    const showTabs = TAB_KEYS.includes(S.cur);
    app.innerHTML = `
      <div class="statusbar"><span>9:41</span><span>4G ▮▮▮</span></div>
      <div class="view" id="view">${v.html}</div>
      ${v.bar || ''}
      ${showTabs ? tabbarHTML() : ''}
      <div class="sheet-wrap ${S.sheet ? 'open' : ''}" id="sheet" onclick="closeSheet()">${S.sheet ? `<div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><h3>${S.sheet.t}</h3>${S.sheet.b}<button class="btn btn-primary btn-block" onclick="closeSheet()" style="margin-top:6px;background:var(--teal-deep)">Close</button></div>` : ''}</div>
      <div class="toast" id="toast"></div>`;
    const nv = document.getElementById('view');
    if (nv) nv.scrollTop = keep;
  }
  updateNotes();
  buildIndex();
}

/* ---------- Index and notes ---------- */
function groups() {
  const work = isFac()
    ? [['today', 'Today'], ['queue', ROLES[S.role].short === 'Pharmacy' ? 'Stock' : ROLES[S.role].short === 'Lab' ? 'Tests' : 'Capacity'], ['requests', S.role === 'hospital' ? 'Referrals' : 'Orders'], ['wallet', 'Wallet'], ['profile', 'Profile']]
    : [['today', 'Today'], ['requests', 'Requests'], ['visit', 'Visit in progress'], ['calendar', 'Calendar'], ['wallet', 'Wallet'], ['profile', 'Profile']];
  return [
    { name: 'Start', items: [['splash', 'Splash'], ['roles', 'Choose provider type'], ['signup', 'Sign up'], ['verify', 'Verification: under review'], ['verify', 'Verification: needs info', { need: 1 }], ['golive', 'Go live setup']] },
    { name: 'Work', items: work },
    { name: isFac() ? 'Facility tools' : 'Patient care', items: isFac() ? (S.role === 'lab' ? [['catalogue', 'Test price list'], ['testform', 'Add a test']] : []) : [['requests', 'Incoming request', { open: 1 }], ['visit', 'Visit steps']] }
  ];
}
function buildIndex() {
  document.getElementById('roles-idx').innerHTML = ROLE_ORDER.map(r => `<button class="${S.role === r ? 'on' : ''}" onclick="setRole('${r}')">${ROLES[r].short}</button>`).join('');
  const idx = document.getElementById('index');
  idx.innerHTML = groups().filter(g => g.items.length).map(g => `<div class="idx-group">${g.name}</div>` + g.items.map(([n, l, p = {}]) => {
    const on = S.cur === n && (n !== 'verify' || (p.need ? S.p.need : !S.p.need));
    return `<button class="idx-btn ${on ? 'on' : ''}" onclick='swap("${n}",${JSON.stringify(p)})'>${l}</button>`;
  }).join('')).join('');
}
const NOTES = {
  splash: { t: 'Splash', tags: ['Provider brand'], body: 'Teal replaces the patient navy to signal a working tool, not a consumer app. The same swinging cable keeps the family resemblance across the whole product.', list: ['Holds for 2.6 seconds, then moves to choosing a provider type.', 'The tagline names the provider promise, not the patient benefit.'] },
  roles: { t: 'Choose provider type', tags: ['Six provider types', 'One app'], body: 'One app serves six kinds of provider. The type decides the dashboard, the fields and the regulator, so people never see an irrelevant screen. Choosing a type is the first decision a provider makes.', list: ['Individuals and facilities share the same sign up and verification flow.', 'Each card names the regulator so the right licence is requested.', 'The chosen type sets the whole dashboard, and can be changed in the switcher.'] },
  signup: { t: 'Sign up', tags: ['Provider Agreement', 'Privacy'], body: 'Account details are short. Both legal boxes start unchecked, and the Provider Agreement is separate from patient terms because providers carry professional responsibilities.', list: ['Continue stays disabled until both boxes are ticked.', 'The Read links open the full text in a sheet.', 'Verification comes next, so the account is clearly not yet live.'] },

/* ---------- Visit flow (person) ---------- */
function startVisit(id) { const r = REQS.find(x => x.id === id); S.active = r; S.step = 0; go('visit'); }
function vVisit() {
  const r = S.active || REQS[0];
  const steps = ['Arrived', 'Vitals', 'Notes', 'Plan', 'Complete'];
  const pct = S.step;
  let body = '';
  if (S.step === 0) body = `<div class="pat-card"><div class="av sm" style="background:#fff">${r.who.split(' ').map(w => w[0]).slice(0, 2).join('')}</div><div style="flex:1"><b style="font-size:16px">${r.who}</b><div class="small muted">${r.age} years · ${r.what}</div><div class="tags"><span class="tag">Allergies: ${r.allergy}</span></div></div></div>
    <div class="card" style="margin-top:14px"><h4>Reason for visit</h4><p class="small">${r.reason}</p></div>
    <div class="privacy-note" style="margin-top:12px">${ic('lock')}<span>Full address and phone number are shared only with you for this visit.</span></div>
    <div class="row" style="gap:10px;margin-top:14px"><button class="btn btn-soft" style="flex:1;min-height:48px" onclick="toast('Calling patient')">${ic('phone')} Call</button><button class="btn btn-soft" style="flex:1;min-height:48px" onclick="toast('Directions open in maps')">${ic('pin')} Directions</button></div>`;
  if (S.step === 1) body = `<h3 style="margin-bottom:12px">Record vitals</h3><div class="vitals-in">
    <div><label>Blood pressure (mmHg)</label><input class="field-sm" value="148/92"></div><div><label>Pulse (bpm)</label><input class="field-sm" value="84"></div>
    <div><label>Temperature (°C)</label><input class="field-sm" value="36.9"></div><div><label>Oxygen (%)</label><input class="field-sm" value="97"></div></div>
    <div class="card" style="margin-top:14px;background:#FFF9EC;border-color:#F6E0B0"><div class="row">${ic('alert', '', 'color:#8A5300')}<p class="small"><b>Blood pressure is above target.</b> Note the reading and the plan in the next step.</p></div></div>`;
  if (S.step === 2) body = `<h3 style="margin-bottom:12px">Visit notes</h3><textarea class="field-sm" placeholder="What you found, what you advised and what happens next.">Blood pressure raised today. Patient reports headaches in the morning. Medicine taken as prescribed. Advised salt reduction and a review in 2 weeks.</textarea><p class="xs muted" style="margin-top:8px">Notes save automatically and become part of the patient visit record.</p>`;
  if (S.step === 3) body = `<h3 style="margin-bottom:12px">Plan and prescriptions</h3>
    <div class="card" style="padding:4px 16px">
      <div class="switch-row"><div>Prescribe medicine<small>Send to a partner pharmacy</small></div><button class="toggle on" onclick="this.classList.toggle('on')"></button></div>
      <div class="switch-row"><div>Book follow up<small>Suggested in 2 weeks</small></div><button class="toggle on" onclick="this.classList.toggle('on')"></button></div>
      <div class="switch-row"><div>Refer to a hospital<small>Patient sees referral details first</small></div><button class="toggle toggle-off" onclick="this.classList.toggle('on')"></button></div>
    </div>
    <div class="card" style="margin-top:12px"><h4>Medicine</h4><div class="qitem"><div class="main"><b>Amlodipine 5mg</b><small>28 tablets · 1 each morning</small></div><span class="pill ok">In stock</span></div></div>`;
  if (S.step === 4) body = `<div class="done-hero"><div class="big">${ic('check')}</div><h1>Visit complete</h1><p class="muted" style="margin:8px auto 0;max-width:280px;font-size:14px">The record is sent to ${r.who.split(' ')[0]}. ${ngn(r.pay)} moves to your wallet after sign off.</p></div>
    <div class="card"><div class="kv"><span>Visit fee</span><b class="num">${ngn(r.pay)}</b></div><div class="kv"><span>Status</span><b>Awaiting sign off</b></div><div class="kv"><span>Payout</span><b>Fri, 30 Oct</b></div></div>`;
  const last = S.step === 4;
  return V(`${topbar('Visit')}
    <div class="vstep">${steps.map((_, i) => `<span class="${i <= pct ? 'on' : ''}"></span>`).join('')}</div>
    <div class="row between" style="padding:6px 20px 14px"><span class="small muted">Step ${S.step + 1} of 5</span><b style="color:var(--navy);font-size:14px">${steps[S.step]}</b></div>
    <div class="pad">${body}</div>`,
    `<div class="cta-bar">${S.step > 0 && !last ? `<button class="btn btn-soft" style="min-width:110px" onclick="S.step--;render()">Back</button>` : ''}<button class="btn" style="flex:1;background:var(--teal-deep);color:#fff;border:0;border-radius:999px;min-height:52px;font-weight:700;cursor:pointer" onclick="${last ? "swap('today')" : S.step === 0 ? 'S.step++;render()' : 'S.step++;render()'}">${last ? 'Back to dashboard' : S.step === 0 ? 'I have arrived' : S.step === 3 ? 'Complete visit' : 'Next'}</button></div>`);
}

/* ---------- Calendar ---------- */
function calendarHTML() {
  const first = new Date(2026, 9, 1).getDay();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<span></span>');
  for (let d = 1; d <= 31; d++) {
    const cls = [d < 27 ? 'past' : '', d === 27 ? 'today' : '', S.blocked[d] ? 'full' : (COUNTS[d] >= 4 ? 'booked' : (COUNTS[d] ? 'open' : '')), d === S.day ? 'sel' : ''].join(' ');
    cells.push(`<button class="cal-d ${cls}" ${d < 27 ? 'disabled' : ''} onclick="S.day=${d};render()">${d}</button>`);
  }
  return cells.join('');
}
function vCalendar() {
  const d = S.day;
  const count = COUNTS[d] || 0;
  const blocked = !!S.blocked[d];
  const label = new Date(2026, 9, d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const sample = SCHED.slice(0, Math.min(count, SCHED.length));
  return V(`
    <div class="hello" style="padding-top:8px"><h1>Calendar</h1><small>Bookings and time off</small></div>

        <div class="card"><div class="kv"><span>Weekdays</span><b>8:00 am to 6:00 pm</b></div><div class="kv"><span>Saturdays</span><b>9:00 am to 2:00 pm</b></div></div></div>
    </div>`);

    <div class="pad" style="margin-top:14px"><div class="card" style="padding:4px 16px">

      </div>
      ${isFac() ? `<div class="section"><div class="section-head"><h3>Team</h3><button class="link" onclick="toast('Add a team member opens here')">Add</button></div><div class="card" style="padding:4px 16px"><div class="list-item"><div class="av sm" style="background:#FFE6C9">AO</div><div class="main"><b>Adaeze O.</b><small>Manager · full access</small></div></div><div class="list-item"><div class="av sm" style="background:#CBF3EC">TB</div><div class="main"><b>Tunde B.</b><small>Staff · stock and orders</small></div></div></div></div>` : ''}
      <div class="section"><div class="section-head"><h3>Support</h3></div>
        <div class="card" style="padding:4px 16px"><div class="list-item"><div class="av sm" style="background:#E3F7F4;color:var(--teal-deep)">${ic('mail')}</div><div class="main"><b>Email support</b><small>contact@streetdocmd.com</small></div></div></div>
      </div>
      <button class="btn btn-soft btn-block" style="margin-top:20px" onclick="swap('roles')">${ic('logout')} Sign out</button>
    </div>`);
}

/* ---------- Lab price list ---------- */
const blankForm = () => ({ id: null, n: '', cat: 'Blood', p: '', tat: 'Same day', sample: 'Blood', home: true, prep: '', on: true });
function isValidForm() { const f = S.form; return !!f && f.n.trim().length > 2 && Number(f.p) > 0; }
function openTestForm(id) {
  const t = id ? LAB_TESTS.find(x => x.id === id) : null;
  S.form = t ? { ...t } : blankForm();
  go('testform', { id: id || null });
}
function F(k, v) {
  if (!S.form) S.form = blankForm();
  S.form[k] = v;
  if (k === 'p') { const pp = document.getElementById('pp'); if (pp) pp.textContent = previewText(); }
  const sb = document.getElementById('savebtn'); if (sb) sb.disabled = !isValidForm();
}
function FR(k, v) { F(k, v); render(); }
function previewText() {
  const p = Number(S.form.p) || 0;
  return p ? `Patients pay ${ngn(p + Math.round(p * 0.05))} including the 5 percent service charge. You receive ${ngn(p)}.` : 'Enter a price to see what patients pay.';
}
function saveTest() {
  if (!isValidForm()) return;
  const f = S.form;
  const rec = { n: f.n.trim(), cat: f.cat, p: Math.round(Number(f.p)), tat: f.tat, sample: f.sample, home: f.home, prep: f.prep.trim() || 'No preparation needed', on: f.on, upd: 'Today' };
  if (f.id) Object.assign(LAB_TESTS.find(x => x.id === f.id), rec);
  else LAB_TESTS.push({ id: 'lt' + (LAB_TESTS.length + 1) + Date.now().toString(36).slice(-3), ...rec });
  S.form = null;
  swap('catalogue');
  toast('Saved. New bookings use this price.');
}
function removeTest(id) {
  const i = LAB_TESTS.findIndex(x => x.id === id);
  if (i > -1) LAB_TESTS.splice(i, 1);
  S.form = null; S.sheet = null;
  swap('catalogue');
  toast('Test removed from your price list');
}
function toggleTest(id) { const t = LAB_TESTS.find(x => x.id === id); t.on = !t.on; render(); }
function openImport() {
  openSheet('Import price list', '<p>Upload a CSV with these columns: test name, category, price in Naira, turnaround, sample type, and home collection (yes or no).</p><p class="xs muted">We check every row first. Nothing changes until you confirm.</p><button class="btn btn-block" style="background:var(--teal-deep);color:#fff;border:0;border-radius:999px;min-height:52px;font-weight:700;margin-top:10px;cursor:pointer" onclick="closeSheet();toast(\'Choose a file to check\')">Choose a CSV file</button>');
}
function vCatalogue() {
  const on = LAB_TESTS.filter(t => t.on);
  const avg = on.length ? Math.round(on.reduce((a, t) => a + t.p, 0) / on.length) : 0;
  const homeOn = on.filter(t => t.home).length;
  return V(`
    ${topbar('Price list')}
    <div class="pad">
      <h1 style="font-size:24px;letter-spacing:-0.02em">Your tests and prices</h1>
      <p class="small muted" style="margin:6px 0 16px">Write the price and turnaround for each test or investigation you run. Patients see the tests that are switched on.</p>
      <div class="kpis">
        <div class="kpi"><small>Tests on</small><b class="num">${on.length}</b><div class="small muted">of ${LAB_TESTS.length} listed</div></div>
        <div class="kpi"><small>Average price</small><b class="num">${ngn(avg)}</b><div class="small muted">Before service charge</div></div>
        <div class="kpi"><small>Home collection</small><b class="num">${homeOn}</b><div class="small muted">Tests a collector can take</div></div>
        <div class="kpi"><small>Last update</small><b>Today</b><div class="small muted">Shown to patients now</div></div>
      </div>
      <div class="row" style="gap:10px;margin:16px 0 4px"><button class="btn" style="flex:1;min-height:50px;background:var(--teal-deep);color:#fff;border:0;border-radius:999px;font-weight:700;cursor:pointer" onclick="openTestForm(null)">${ic('plus')} Add a test</button><button class="btn btn-soft" style="flex:1;min-height:50px" onclick="openImport()">${ic('doc')} Import</button></div>
      <div class="section"><div class="section-head"><h3>All tests</h3><span class="small muted">Tap a price to edit</span></div>
        <div class="card" style="padding:4px 16px">
          ${LAB_TESTS.map(t => `<div class="qitem" style="${t.on ? '' : 'opacity:0.6'}">
            <div class="main"><b>${t.n}</b><small>${t.cat} · ${t.sample} · ${t.tat}</small>
              <div class="tag-row" style="margin-top:6px">${t.home ? `<span class="pill teal">${ic('truck')} Home collection</span>` : `<span class="pill idle">Lab visit only</span>`}${t.on ? '' : `<span class="pill idle">${ic('x')} Not offered</span>`}</div>
              <small style="display:block;margin-top:6px">${t.prep}</small>
            </div>
            <div style="text-align:right;flex:none">
              <button class="link num" style="font-size:16px;color:var(--navy);font-weight:800" onclick="openTestForm('${t.id}')">${ngn(t.p)}</button>
              <div class="small muted" style="margin-top:2px">Updated ${t.upd}</div>
              <div class="row" style="gap:8px;margin-top:8px;justify-content:flex-end"><button class="toggle ${t.on ? 'on' : ''}" aria-label="Offer this test" onclick="toggleTest('${t.id}')"></button></div>
            </div>
          </div>`).join('')}
        </div>
      </div>
      <p class="xs muted" style="margin-top:12px">Price changes apply to new bookings only. Bookings already paid keep their price.</p>
    </div>`);
}
function vTestForm() {
  if (!S.form) S.form = blankForm();
  const f = S.form;
  const editing = !!f.id;
  const valid = isValidForm();
  const fee = Number(f.p) || 0;
  return V(`
    ${topbar(editing ? 'Edit test' : 'Add a test')}
    <div class="pad">
      <div class="field-wrap"><label class="field-label">Test or investigation name</label><input class="inp" value="${f.n}" placeholder="e.g. Full blood count" oninput="F('n',this.value)"></div>
      <div class="field-wrap"><label class="field-label">Category</label><div class="chips" style="padding:0;flex-wrap:wrap;overflow:visible">${CATS.map(c => `<button class="chip ${f.cat === c ? 'on' : ''}" onclick="FR('cat','${c}')">${c}</button>`).join('')}</div></div>
      <div class="field-wrap"><label class="field-label">Your price (₦)</label><input class="inp num" type="number" min="0" value="${f.p}" placeholder="e.g. 6500" oninput="F('p',this.value)" style="font-weight:700;font-size:17px"><p id="pp" class="xs" style="margin-top:8px;color:var(--teal-deep);font-weight:700">${previewText()}</p></div>
      <div class="field-wrap"><label class="field-label">How long results take</label><select class="inp" onchange="F('tat',this.value)">${TAT_OPTIONS.map(o => `<option ${f.tat === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
      <div class="field-wrap"><label class="field-label">Sample type</label><div class="chips" style="padding:0;flex-wrap:wrap;overflow:visible">${SAMPLES.map(c => `<button class="chip ${f.sample === c ? 'on' : ''}" onclick="FR('sample','${c}')">${c}</button>`).join('')}</div></div>
      <div class="card" style="padding:4px 16px;margin-bottom:14px">
        <div class="switch-row"><div>Home collection<small>A trained collector visits the patient</small></div><button class="toggle ${f.home ? 'on' : ''}" aria-label="Home collection" onclick="FR('home',${!f.home})"></button></div>
        <div class="switch-row"><div>Offered now<small>Patients can book this test when on</small></div><button class="toggle ${f.on ? 'on' : ''}" aria-label="Offered now" onclick="FR('on',${!f.on})"></button></div>
      </div>
      <div class="field-wrap"><label class="field-label">Preparation for the patient</label><textarea class="field-sm" placeholder="e.g. Fast for 10 hours before the sample. Water is fine." oninput="F('prep',this.value)">${f.prep}</textarea></div>
      ${editing ? `<button class="btn btn-soft btn-block" style="margin-top:6px;color:var(--danger)" onclick="openSheet('Remove this test?', '<p>Patients will no longer see it. Past bookings and results are kept.</p><button class=&quot;btn btn-block&quot; style=&quot;background:var(--danger);color:#fff;border:0;border-radius:999px;min-height:52px;font-weight:700;cursor:pointer&quot; onclick=&quot;removeTest(\\'${f.id}\\')&quot;>Remove test</button>')">Remove this test</button>` : ''}
    </div>`,
    `<div class="cta-bar"><button class="btn btn-soft" style="min-width:110px" onclick="S.form=null;back()">Cancel</button><button id="savebtn" class="btn" ${valid ? '' : 'disabled'} style="flex:1;background:var(--teal-deep);color:#fff;border:0;border-radius:999px;min-height:52px;font-weight:700;cursor:pointer" onclick="saveTest()">${editing ? 'Save changes' : 'Add to price list'}</button></div>`);
}

/* ---------- Route table ---------- */
const VIEWS = {
  roles: vRoles, signup: vSignup, verify: vVerify, golive: vGolive,
  today: vToday, requests: vRequests, visit: vVisit, calendar: vCalendar,
  queue: vQueue, wallet: vWallet, profile: vProfile,
  catalogue: vCatalogue, testform: vTestForm
};

/* ---------- Start ---------- */
swap('splash');
</script>
</body>
</html>
