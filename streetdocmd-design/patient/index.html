<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreetdocMD Patient App | Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---- StreetdocMD design system ---- */
/* StreetdocMD design system v1
   One family (Inter), one blue, one spacing scale.
   Used by: landing site, patient app, provider dashboard, admin back office. */



:root {
  /* Brand */
  --navy: #0D2B5E;
  --blue: #1E6FD9;
  --blue-hover: #1859B5;
  --sky: #EAF3FD;
  --teal: #00B5A3;
  --teal-deep: #007F73;
  --ink: #121D2D;

  /* Neutrals */
  --muted: #5B6878;
  --line: #DCE4EF;
  --bg: #F5F8FC;
  --surface: #FFFFFF;

  /* Status (always paired with an icon or text, never colour alone) */
  --success: #0E7A4F;
  --success-bg: #E6F6EE;
  --warn: #8A5300;
  --warn-bg: #FFF4DB;
  --danger: #B42318;
  --danger-bg: #FDECEA;
  --pending: #3D4B63;
  --pending-bg: #E9EEF6;

  /* Shape and depth */
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(13, 43, 94, 0.06);
  --shadow: 0 1px 2px rgba(13, 43, 94, 0.05), 0 10px 28px rgba(13, 43, 94, 0.08);

  /* Spacing scale (4px base) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;

  /* Type scale */
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px;
  --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 40px; --fs-4xl: 52px;

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #8FB4EC;
    --blue: #5B9BEF;
    --blue-hover: #7DB0F3;
    --sky: #14233D;
    --teal: #2DD4C1;
    --ink: #E7EEF9;
    --muted: #A3B1C6;
    --line: #26354F;
    --bg: #0B1322;
    --surface: #111B2E;
    --success: #5CD39B;
    --success-bg: #123325;
    --warn: #F5C25C;
    --warn-bg: #3A2C10;
    --danger: #FF8A80;
    --danger-bg: #3B1716;
    --pending: #C5D0E2;
    --pending-bg: #1E2A40;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --navy: #8FB4EC;
  --blue: #5B9BEF;
  --blue-hover: #7DB0F3;
  --sky: #14233D;
  --teal: #2DD4C1;
  --ink: #E7EEF9;
  --muted: #A3B1C6;
  --line: #26354F;
  --bg: #0B1322;
  --surface: #111B2E;
  --success: #5CD39B;
  --success-bg: #123325;
  --warn: #F5C25C;
  --warn-bg: #3A2C10;
  --danger: #FF8A80;
  --danger-bg: #3B1716;
  --pending: #C5D0E2;
  --pending-bg: #1E2A40;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { color: var(--navy); line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: var(--fs-2xl); font-weight: 800; }
h2 { font-size: var(--fs-xl); font-weight: 700; }
h3 { font-size: var(--fs-lg); font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Wordmark */
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: var(--navy); font-size: 18px; letter-spacing: -0.01em; text-decoration: none; }
.wordmark .doc { color: var(--blue); }
.mark { width: 30px; height: 30px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; }
.mark svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; }

/* Buttons: minimum 44px touch target */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 var(--s6);
  border-radius: var(--radius-pill); border: 1.5px solid transparent;
  font: 600 var(--fs-md)/1 var(--font); text-decoration: none; cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
.btn:active { transform: scale(0.98); }
.btn:focus-visible, .field:focus-visible, a:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; box-shadow: 0 0 0 5px var(--blue); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-secondary { background: var(--surface); color: var(--navy); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
.btn-ghost { background: transparent; color: var(--blue); padding: 0 var(--s3); }
.btn-block { width: 100%; }
.btn[disabled], .btn.is-disabled { background: var(--pending-bg); color: var(--muted); border-color: transparent; cursor: not-allowed; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }

/* Cards and rows */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: var(--s5); }
.card + .card { margin-top: var(--s4); }
.row { display: flex; align-items: center; gap: var(--s3); }
.between { justify-content: space-between; }
.stack > * + * { margin-top: var(--s3); }
.list-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.icon-tile { width: 44px; height: 44px; border-radius: 12px; background: var(--sky); color: var(--blue); display: grid; place-items: center; flex: none; }
.icon-tile svg.i { width: 22px; height: 22px; }

/* Status pills: text and icon, so colour is never the only signal */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-pill); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; }
.pill svg.i { width: 14px; height: 14px; stroke-width: 2.4; }
.pill-success { background: var(--success-bg); color: var(--success); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-danger { background: var(--danger-bg); color: var(--danger); }
.pill-info { background: var(--sky); color: var(--blue); }
.pill-pending { background: var(--pending-bg); color: var(--pending); }
.badge-soon { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--pending-bg); color: var(--pending); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

/* Verified badge (trust element, always visible) */
.verified { display: inline-flex; align-items: center; gap: 4px; color: var(--teal-deep); font-size: var(--fs-sm); font-weight: 600; }
.verified svg.i { width: 16px; height: 16px; stroke-width: 2.4; }

/* Notices */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: var(--s4); border-radius: var(--radius-sm); background: var(--warn-bg); color: var(--ink); font-size: var(--fs-sm); }
.notice svg.i { color: var(--warn); margin-top: 1px; }
.notice strong { color: var(--ink); }

/* Form controls */
.field-label { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.field { width: 100%; min-height: 48px; padding: 0 var(--s4); border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 500 var(--fs-md)/1 var(--font); }
.field:focus { border-color: var(--blue); outline: none; }
textarea.field { min-height: 96px; padding: var(--s3) var(--s4); line-height: 1.5; resize: vertical; }
.checkbox-row { display: flex; gap: 12px; align-items: flex-start; font-size: var(--fs-sm); padding: var(--s3) 0; }
.checkbox-row input { width: 22px; height: 22px; margin: 0; accent-color: var(--blue); flex: none; }
.checkbox-row a { color: var(--blue); font-weight: 600; }

/* Tabs and bottom navigation */
.tabs { display: flex; gap: var(--s2); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 12px 4px; margin-right: var(--s4); font-weight: 600; color: var(--muted); border-bottom: 2.5px solid transparent; white-space: nowrap; }
.tab.is-active { color: var(--blue); border-bottom-color: var(--blue); }
.bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 8px 4px 16px; }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; min-height: 44px; justify-content: center; }
.bottom-nav a.is-active { color: var(--blue); }
.bottom-nav svg.i { width: 22px; height: 22px; }

/* Phone frame used to show mobile screens */
.phone { width: 360px; height: 740px; border-radius: 40px; background: #0A1424; padding: 10px; box-shadow: 0 30px 60px rgba(13, 43, 94, 0.25); flex: none; }
.phone-screen { width: 100%; height: 100%; border-radius: 31px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
.phone-status { display: flex; justify-content: space-between; padding: 14px 24px 4px; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--surface); }
.phone-body { flex: 1; overflow: hidden; padding: var(--s4); }
.phone-header { background: var(--navy); color: #fff; padding: var(--s4) var(--s5) var(--s5); }
.phone-header h2, .phone-header h3 { color: #fff; }
.phone-header .muted { color: #C9D7EE; }

/* Empty, loading, and locked states */
.empty { text-align: center; padding: var(--s8) var(--s5); }
.empty .icon-tile { margin: 0 auto var(--s4); width: 64px; height: 64px; }
.skeleton { background: linear-gradient(90deg, var(--line) 25%, var(--bg) 50%, var(--line) 75%); background-size: 200% 100%; border-radius: 8px; height: 14px; animation: sh 1.4s infinite; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Layout helpers */
.container { max-width: 1160px; margin: 0 auto; padding: 0 var(--s6); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4); }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s4); }
@media (max-width: 760px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---- Patient app ---- */
/* StreetdocMD patient app, light theme. */

html, body { height: 100%; }
body { margin: 0; background: #EDF3FA; font-family: var(--font); color: var(--ink); }
button { font-family: var(--font); }
input, textarea, select { font-family: var(--font); }

/* Studio layout: index | device | notes */
.studio { display: grid; grid-template-columns: 250px 1fr 340px; height: 100vh; }
.index { background: #fff; border-right: 1px solid var(--line); overflow: auto; padding: 22px 16px; }
.stage {
  display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px;
  background: radial-gradient(circle at 50% 25%, #FFFFFF 0%, #EDF3FA 70%);
}
.notes { background: #fff; border-left: 1px solid var(--line); overflow: auto; padding: 24px 22px; }

.idx-brand { padding: 0 8px 18px; }
.idx-group { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 8px 6px; }
.idx-btn {
  display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 8px 10px; border-radius: 10px; font: 600 13px var(--font); color: var(--ink);
}
.idx-btn:hover { background: var(--sky); }
.idx-btn.on { background: var(--navy); color: #fff; }

.notes h3 { font-size: 18px; margin-bottom: 6px; }
.notes .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
.notes .note-block { padding: 14px 0; border-top: 1px solid var(--line); }
.notes .note-block h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
.notes .note-block p, .notes .note-block li { font-size: 13px; color: var(--ink); line-height: 1.55; }
.notes ul { padding-left: 18px; margin: 0; }
.notes li + li { margin-top: 6px; }

/* Device */
.device { width: 390px; height: 812px; border-radius: 52px; background: #0A1424; padding: 12px; box-shadow: 0 40px 80px rgba(13, 43, 94, 0.25); flex: none; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
.statusbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px 6px; font-size: 14px; font-weight: 700; background: var(--bg); flex: none; }
.view { flex: 1; overflow-y: auto; padding-bottom: 28px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.pad { padding: 0 20px; }
.section { margin-top: 26px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.section-head h3 { font-size: 17px; }
.section-head a, .link { color: var(--blue); font-weight: 700; font-size: 13px; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }

.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 6px 6px 20px; flex: none; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; font-size: 11px; font-weight: 600; color: var(--muted); background: none; border: 0; cursor: pointer; }
.tab svg.i { width: 22px; height: 22px; }
.tab.on { color: var(--blue); }

/* Top bars */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 20px 14px; }
.topbar h2 { font-size: 17px; text-align: center; flex: 1; }
.iconbtn {
  width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
  display: grid; place-items: center; cursor: pointer; color: var(--navy); flex: none;
}
.iconbtn svg.i { width: 20px; height: 20px; }
.iconbtn.ghost-dark { background: rgba(255,255,255,0.16); border-color: transparent; color: #fff; }

/* Splash */
.splash {
  position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: linear-gradient(165deg, #0D2B5E 0%, #1B55B0 55%, #1E6FD9 100%); color: #fff; overflow: hidden;
}
.splash::before, .splash::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.06); }
.splash::before { width: 420px; height: 420px; top: -140px; right: -160px; }
.splash::after { width: 300px; height: 300px; bottom: -120px; left: -120px; }
.cable-wrap { position: relative; height: 90px; width: 2px; transform-origin: top center; animation: swing 2.6s ease-in-out infinite; }
.cable-wrap::before { content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 74px; background: rgba(255,255,255,0.85); }
.cable-wrap::after { content: ""; position: absolute; left: -7px; top: 72px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
@keyframes swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
.logo-big { width: 92px; height: 92px; border-radius: 28px; background: #fff; display: grid; place-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.25); position: relative; z-index: 1; }
.logo-big svg { width: 46px; height: 46px; stroke: var(--blue); fill: none; stroke-width: 3; stroke-linecap: round; }
.splash .wm { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; position: relative; z-index: 1; }
.splash .wm span { color: #9CC7FF; }
.splash .tagline { font-size: 15px; color: #CFE0F7; position: relative; z-index: 1; }
.splash .loader { width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.2); overflow: hidden; margin-top: 18px; position: relative; z-index: 1; }
.splash .loader span { display: block; height: 100%; width: 40%; background: #fff; border-radius: 4px; animation: load 2.2s ease-in-out forwards; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* Onboarding */
.onb { flex: 1; display: flex; flex-direction: column; padding: 8px 24px 24px; }
.onb-art { flex: 1; display: flex; align-items: center; justify-content: center; }
.onb-stage { width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #FFFFFF 0%, #DCEAFB 60%, #C9E0FA 100%); position: relative; }
.onb-stage .float { position: absolute; border-radius: 22px; background: #fff; box-shadow: var(--shadow); display: grid; place-items: center; }
.onb-stage .float svg.i { width: 30px; height: 30px; }
.onb h1 { font-size: 28px; letter-spacing: -0.02em; margin-top: 8px; }
.onb p.body { color: var(--muted); margin-top: 10px; font-size: 15px; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 22px 0 18px; }
.dots span { width: 8px; height: 8px; border-radius: 4px; background: var(--line); transition: width 0.2s; }
.dots span.on { width: 24px; background: var(--blue); }

/* Buttons and inputs */
.btn { min-height: 52px; font-size: 15px; }
.btn-block { width: 100%; }
.btn:disabled { background: #E3EAF4; color: #7C8A9C; cursor: not-allowed; }
.btn-soft { background: var(--sky); color: var(--navy); border: 0; min-height: 44px; }
.field-wrap { margin-bottom: 16px; }
.inp { width: 100%; min-height: 52px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; padding: 0 16px; font-size: 15px; color: var(--ink); }
.inp:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px var(--sky); }
.search {
  display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--line);
  border-radius: 18px; height: 54px; padding: 0 16px; color: var(--muted); cursor: text;
}
.search input { flex: 1; border: 0; outline: none; background: transparent; font-size: 15px; color: var(--ink); min-width: 0; }
.search svg.i { width: 20px; height: 20px; color: var(--navy); flex: none; }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px var(--sky); }
.legal-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; font-size: 14px; line-height: 1.45; }
.legal-row input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--blue); flex: none; }
.legal-row a { color: var(--blue); font-weight: 700; text-decoration: none; }
.legal-row .read { margin-left: 4px; }

/* Chips and segments */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 20px 4px; }
.chips .chip:last-child { margin-right: 20px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip.multi.on { background: var(--sky); border-color: var(--blue); color: var(--navy); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: #E6EEF8; border-radius: 16px; padding: 4px; }
.seg button { border: 0; background: none; min-height: 42px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--navy); box-shadow: 0 2px 8px rgba(13,43,94,0.12); }

/* Home */
.hello { padding: 4px 20px 16px; }
.hello small { color: var(--muted); font-size: 13px; font-weight: 600; }
.hello h1 { font-size: 26px; letter-spacing: -0.02em; margin-top: 2px; }
.next-card {
  margin: 0 20px; border-radius: 26px; padding: 20px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(140deg, #0D2B5E 0%, #1E6FD9 100%); box-shadow: 0 18px 36px rgba(13,43,94,0.28);
}
.next-card::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; right: -60px; top: -60px; background: rgba(255,255,255,0.09); }
.next-card h3 { color: #fff; font-size: 19px; margin-top: 12px; }
.next-card .meta { color: #CFE0F7; font-size: 13px; margin-top: 4px; }
.next-card .row-btns { display: flex; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
.next-card .btn-white { background: #fff; color: var(--navy); min-height: 44px; flex: 1; font-size: 14px; }
.next-card .btn-glass { background: rgba(255,255,255,0.16); color: #fff; min-height: 44px; flex: 1; font-size: 14px; }
.pill-glass { background: rgba(255,255,255,0.18); color: #fff; }
.countdown { display: flex; gap: 6px; margin-top: 14px; }

/* ---------- State ---------- */
let S = { cur: 'splash', p: {}, stack: [], slide: 0, seg: 'providers', filter: 'all', q: '', day: 28, time: null, tab: 'upcoming', rate: 0, legal: { terms: false, privacy: false }, sheet: null, splashT: null, waitT: null, last: '' };

/* ---------- Navigation ---------- */
function go(name, p = {}) { S.stack.push({ cur: S.cur, p: S.p }); S.cur = name; S.p = p; S.sheet = null; render(); }
function back() { const pr = S.stack.pop(); if (pr) { S.cur = pr.cur; S.p = pr.p; } else { S.cur = 'home'; S.p = {}; } S.sheet = null; render(); }
function swap(name, p = {}) { S.cur = name; S.p = p; S.stack = []; S.sheet = null; render(); }
function toast(msg) { const t = document.getElementById('toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 1800); }
function openLegal(k) {
  const terms = { t: 'Patient Terms of Service', b: '<p>The full Patient Terms will appear here once approved by our legal team. They explain how StreetdocMD connects you with independent licensed professionals, how bookings and payments work, and your responsibilities during a visit.</p><p>Read the full text before you pay. You can request a copy at any time at contact@streetdocmd.com.</p>' };

  S.sheet = k === 'terms' ? terms : privacy; render();
}
function closeSheet() { S.sheet = null; render(); }

/* ---------- Render shell ---------- */
const TABS = ['home', 'search', 'visits', 'care', 'profile'];
const TAB_DEF = [['home', 'Home', 'home'], ['search', 'Search', 'search'], ['visits', 'Visits', 'calendar'], ['care', 'Care', 'heart'], ['profile', 'Profile', 'user']];
function tabbarHTML() {
  return `<nav class="tabbar">${TAB_DEF.map(([k, l, i]) => `<button class="tab ${S.cur === k ? 'on' : ''}" onclick="swap('${k}')">${ic(i)}${l}</button>`).join('')}</nav>`;

function splashHTML() {

}
function V(html, bar = '') { return { html, bar }; }
function render() {
  const app = document.getElementById('app');

  S.last = S.cur;
  if (S.cur === 'splash') {
    app.innerHTML = splashHTML() + `<div class="toast" id="toast"></div>`;

    const fn = VIEWS[S.cur] || (() => V('<div class="empty-line">Screen not found</div>'));
    const v = fn();
    app.innerHTML = `
      <div class="statusbar"><span>9:41</span><span>4G ▮▮▮</span></div>

      ${v.bar || ''}

}

/* ---------- Index and notes ---------- */

}
const NOTES = {
  splash: { t: 'Splash', tags: ['Brand moment', 'Auto advances'], body: 'The swinging stethoscope cable from the wordmark becomes the one brand motion in the app. It holds for about 2.6 seconds, then moves to onboarding. Returning users can skip it on later launches.', list: ['Uses the navy and blue trust palette from the brand.', 'Reads as a calm welcome, not a loading screen.', 'Respect reduced motion settings in the production build.'] },
  onboard: { t: 'Onboarding', tags: ['Three promises', 'Skip always visible'], body: 'Each slide answers one reason a stranger is allowed into someone’s home: the visit, the verification, and the price. The account is only requested after the value is clear.', list: ['Skip is always visible, so returning users are not held up.', 'Dots show progress and the last button changes to Get started.', 'No personal data is asked for on these slides.'] },
  signup: { t: 'Sign up', tags: ['Legal checkboxes unchecked', 'Read opens in a sheet'], body: 'The two legal checkboxes start unchecked and stay separate, as required. Create account stays disabled until both are ticked. Each Read link opens the full text in a sheet so people never lose their place.', list: ['Patient Terms and Privacy Policy only. Provider and facility agreements sit in their own apps.', 'Phone number comes first, because it is how a provider confirms the visit.', 'Sign in is one tap away for returning users.'] },
  medprofile: { t: 'Medical profile', tags: ['Skippable', 'Chips, not typing'], body: 'Asked straight after sign up and never blocking. Allergies and conditions matter for safe care, so the prompt says why in plain words. Tapping chips is faster than typing on a phone.', list: ['Allergies and conditions are shown to the provider before the visit.', 'Emergency contact is a safety feature, not a marketing field.', 'Skip returns home with a gentle nudge later, not a blocking screen.'] },
  home: { t: 'Home', tags: ['Next visit first', 'Retention layer'], body: 'Home answers one question first: what is happening with my care. The next visit leads, then unfinished work, then services. Book again, refill reminders and the profile nudge bring people back without noise.', list: ['Continue where you left off returns people to unfinished orders.', 'Book again on past providers shortens the path to a repeat visit.', 'Refill reminders turn medication needs into a reason to return.', 'Coming soon items are visible but disabled, which sets expectations.'] },
  search: { t: 'Search', tags: ['Providers and facilities', 'Live filtering'], body: 'One search for everyone. Individuals and facilities share a single results view, split by a segmented control. Filter chips change with the segment, so the choices always make sense.', list: ['Each result shows the verified regulator, rating, distance and price before the tap.', 'Availability uses plain words: available now, or free at a given time.', 'Typing filters the list live without reloading the screen.'] },
  'provider': { t: 'Provider profile', tags: ['Calendar schedule', 'Price in sticky bar'], body: 'The schedule is a month calendar. Green days are open, red days are partly booked and grey days are fully booked. Patients see that a slot is taken, never who booked it, which protects both sides.', list: ['The price stays in the sticky bar, so it is visible at any scroll point.', 'The verified badge and years of experience sit directly under the name.', 'Reviews and bio come after the schedule, because the time is the deciding factor.'] },
  'facility-pharmacy': { t: 'Pharmacy profile', tags: ['Stock list', 'Text and colour together'], body: 'Medicines are a stock list. Each item says in stock, low with the count left, or out of stock. Out of stock items cannot be added, which saves a failed order later.', list: ['Search filters the list as the patient types.', 'Low stock is a warning, so people order before they run out.', 'Delivery time sits in the header, not hidden until checkout.'] },
  'facility-lab': { t: 'Lab profile', tags: ['Tests on offer', 'Home sample collection'], body: 'Tests are listed with price and turnaround time, the two things a patient needs to decide. Home sample collection is named at the top, with the privacy note that explains what the lab sees.', list: ['The most booked test is tagged to help first time patients choose.', 'Each test has its own Book button, so the flow starts at the right test.', 'Results arrive in the app and are linked from the Care tab.'] },
  'facility-hospital': { t: 'Hospital profile', tags: ['Live capacity', 'Privacy first'], body: 'Hospitals show capacity in plain words: beds free, or fully booked. Referral details stay private until the hospital acknowledges the referral, so patients know exactly what is shared.', list: ['Capacity uses the warning and danger pills, so status is never colour alone.', 'The referral card states exactly what the hospital receives.', 'Emergency guidance appears wherever booking starts.'] },
  'booking-who': { t: 'Who, when, where', tags: ['Three choices', 'Emergency notice'], body: 'Three decisions on one screen: who the visit is for, when, and where. The target card stays at the top so the patient always knows what they are booking and what it costs.', list: ['Who is it for is a segmented control, because that is the most common switch.', 'Schedule reveals dates and times only when chosen, which keeps Now simple.', 'The emergency notice appears here, where booking starts.'] },
  'booking-pay': { t: 'Review and pay', tags: ['Price before commitment', 'Paystack'], body: 'The total breaks down into fee and service charge, and payment methods sit under Paystack. Pay stays disabled until both legal boxes are ticked, and the button always shows the amount.', list: ['Legal boxes start unchecked and are never ticked by default.', 'Each Read link opens the full text without leaving the booking.', 'The total is repeated on the button, so it is the last thing read.'] },
  waiting: { t: 'Waiting for accept', tags: ['Two minute window', 'Calm state'], body: 'A calm wait. The ring shows the acceptance window in brand blue, not alarm red. If the provider declines, the next step offers the nearest available provider, so the patient is never stuck.', list: ['The wording says what happens next in both outcomes.', 'The prototype moves to tracking after 3 seconds to show the handover.', 'Cancel is always available and never buried.'] },
  track: { t: 'Live tracking', tags: ['Timeline is the status', 'One tap to call'], body: 'Live tracking shows the provider moving toward the address, a clear ETA and status steps in plain language. The timeline carries the meaning, so the map is support, not the only signal. Scheduled visits show a date card instead.', list: ['Each step says what it means in full, such as Heading to Ikeja, 3.4 km.', 'Calling the provider is one tap from the card.', 'Share my location lets family follow the visit without calling.'] },
  visit: { t: 'Visit record', tags: ['Document, not a receipt', 'One next action each'], body: 'The visit record turns a consultation into a usable document: vitals, plan, prescriptions, lab orders, referral and rating. Each section ends with one clear next action, so the screen never becomes a dead end.', list: ['Send to pharmacy and home sample collection link to partners directly.', 'The referral card states what the hospital receives.', 'Rating and follow up come last, when the patient is ready to decide.'] },

  profile: { t: 'Profile', tags: ['Medical details', 'Legal and support'], body: 'Profile holds the medical details that make a visit safe, plus family, legal and support. Legal links and the support email are always one tap away, which builds trust with a first time user.', list: ['Allergies and conditions are shown first, because providers need them first.', 'Support is email only, as the brief requires, with a clear reply promise.', 'Socials sit at the bottom, not in the way of the primary tasks.'] },

  document.getElementById('note-tags').innerHTML = n.tags.map(t => `<span class="pill info">${t}</span>`).join('');

  document.getElementById('note-list').innerHTML = n.list.map(x => `<li>${x}</li>`).join('');

function setSeg(v) { S.seg = v; S.filter = 'all'; render(); }

function chipsHTML() {
  const list = S.seg === 'providers' ? [['all', 'All'], ['doctor', 'Doctors'], ['nurse', 'Nurses'], ['physio', 'Physiotherapy']] : [['all', 'All'], ['pharmacy', 'Pharmacies'], ['lab', 'Labs'], ['hospital', 'Hospitals']];
  return `<div class="chips">${list.map(([id, l]) => `<button class="chip ${S.filter === id ? 'on' : ''}" onclick="setFilter('${id}')">${l}</button>`).join('')}</div>`;

function resultsHTML() {
  const q = S.q.trim().toLowerCase();
  const src = S.seg === 'providers' ? PROVIDERS : FACS;
  const list = src.filter(x => (S.filter === 'all' || x.type === S.filter) && (!q || (x.name + ' ' + (x.role || '') + ' ' + x.area + ' ' + x.type).toLowerCase().includes(q)));

  return list.map(x => S.seg === 'providers' ? `
    <button class="result" onclick="go('provider',{id:'${x.id}'})">
      ${avatar(x.ini, x.tint)}
      <div class="body">

}

/* ---------- Provider profile ---------- */
const BOOK_STATE = d => d < TODAY ? 'past' : FULL.includes(d) ? 'full' : BOOKED.includes(d) ? 'booked' : 'open';
function calHTML() {
  const first = new Date(2026, 9, 1).getDay();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<span></span>');
  for (let d = 1; d <= 31; d++) {
    const st = BOOK_STATE(d);
    const cls = [st, d === TODAY ? 'today' : '', d === S.day ? 'sel' : ''].join(' ');
    cells.push(`<button class="cal-d ${cls}" ${st === 'past' ? 'disabled' : ''} onclick="pickDay(${d})">${d}</button>`);
  }
  return `<div class="card">
    <div class="cal-top"><b>October 2026</b><div class="row" style="gap:6px"><button class="iconbtn" style="width:34px;height:34px;border-radius:12px" disabled>${ic('chevL', '', 'width:16px;height:16px')}</button><button class="iconbtn" style="width:34px;height:34px;border-radius:12px" onclick="toast('Next month loads here')">${ic('chevR', '', 'width:16px;height:16px')}</button></div></div>
    <div class="cal-grid">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div>
    <div class="cal-legend"><span><i style="background:#EAF8F5"></i>Open</span><span><i style="background:#FDECEA"></i>Partly booked</span><span><i style="background:#E6EBF3"></i>Fully booked</span></div>
    <div id="slots">${slotsHTML()}</div>
  </div>`;
}
function slotsHTML() {
  const d = S.day, st = BOOK_STATE(d);
  const label = new Date(2026, 9, d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  if (st === 'full') return `<div style="margin-top:16px"><b style="font-size:14px">${label}</b><p class="slot-note">Fully booked. Pick another day, or ask for the next available time.</p></div>`;
  const taken = st === 'booked' ? [1, 4] : [];
  return `<div style="margin-top:16px"><b style="font-size:14px">${label}</b></div>
    <div class="slots">${TIMES.map((t, i) => `<button class="slot ${taken.includes(i) ? 'taken' : ''} ${S.time === i ? 'on' : ''}" ${taken.includes(i) ? 'disabled' : ''} onclick="pickTime(${i})">${t}</button>`).join('')}</div>
    <p class="slot-note">${taken.length ? 'Greyed times are already booked by other patients.' : 'All times are open. Choose one to start a booking.'}</p>`;
}

          <div class="list-item" onclick="openLegal('terms')" style="cursor:pointer"><div class="av sm" style="background:var(--sky);color:var(--blue)">${ic('doc')}</div><div class="main"><b>Patient Terms</b><small>How bookings and payments work</small></div>${ic('chevR', '', 'color:var(--muted)')}</div>
          <div class="list-item" onclick="openLegal('privacy')" style="cursor:pointer"><div class="av sm" style="background:var(--sky);color:var(--blue)">${ic('lock')}</div><div class="main"><b>Privacy Policy</b><small>Who sees your records and why</small></div>${ic('chevR', '', 'color:var(--muted)')}</div>
          <div class="list-item" onclick="toast('Notification settings open here')" style="cursor:pointer"><div class="av sm" style="background:var(--sky);color:var(--blue)">${ic('bell')}</div><div class="main"><b>Notifications</b><small>Visit updates and reminders</small></div>${ic('chevR', '', 'color:var(--muted)')}</div>
        </div>
      </div>

      <div class="section"><div class="section-head"><h3>Support</h3></div>
        <div class="card" style="padding:4px 16px">
          <div class="list-item"><div class="av sm" style="background:var(--sky);color:var(--blue)">${ic('mail')}</div><div class="main"><b>Email support</b><small>contact@streetdocmd.com</small></div></div>
          <div class="list-item"><div class="av sm" style="background:var(--sky);color:var(--blue)">${ic('globe')}</div><div class="main"><b>Follow us</b><small>Instagram, TikTok and Facebook</small></div></div>
        </div>
      </div>

      <button class="btn btn-soft btn-block" style="margin-top:20px" onclick="swap('signup')">${ic('logout')} Sign out</button>
    </div>`);
}
function vFamily() {
